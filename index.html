<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Card Clean</title>

    <style>
      /* RESET + BASE */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #f5f5f5;
      }

      /* CARD */
      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
        width: 220px;
        height: 350px;
        border-radius: 20px;
        overflow: hidden;
        background-color: #fff;
        box-shadow: 12px 12px 0 rgba(0, 0, 0, 0.1);
      }

      /* LANDSCAPE */
      .landscape-section {
        position: relative;
        width: 100%;
        height: 70%;
        overflow: hidden;
      }

      .landscape-section * {
        position: absolute;
      }

      .sky {
        width: 100%;
        height: 100%;
        background: linear-gradient(0deg, #f7e157 0%, #e96594 100%);
      }

      /* SUN */
      .sun {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 45px;
        height: 45px;
        border-radius: 50%;
        background-color: #fff;
        bottom: 40%;
        left: 23%;
        filter: drop-shadow(0 0 10px #fff);
        animation: sunFloat 4s ease-in-out infinite;
      }

      .sun::after,
      .sun::before {
        content: '';
        position: absolute;
        border-radius: 50%;
        background-color: #fff;
      }

      .sun::after {
        width: 118%;
        height: 118%;
        opacity: 0.5;
      }

      .sun::before {
        width: 134%;
        height: 134%;
        opacity: 0.1;
      }

      @keyframes sunFloat {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }

      /* OCEAN */
      .ocean {
        bottom: 0;
        width: 100%;
        height: 28%;
        overflow: hidden;
        background: linear-gradient(0deg, #f1c07d 0%, #f7da96 100%);
      }

      .reflection {
        background-color: #fff;
        opacity: 0.5;
        z-index: 1;
      }

      .reflection:nth-child(1) {
        width: 40px;
        height: 10px;
        top: 5%;
        left: 32%;
        clip-path: polygon(0 0, 100% 0, 50% 20%);
      }
      .reflection:nth-child(2) {
        width: 80px;
        height: 15px;
        top: 15%;
        left: 39%;
        clip-path: polygon(0 0, 100% 0, 60% 20%, 40% 20%);
      }
      .reflection:nth-child(3) {
        width: 60px;
        height: 2px;
        top: 27%;
        right: 15%;
        clip-path: polygon(0 50%, 40% 0, 60% 0, 100% 50%, 60% 100%, 40% 100%);
      }
      .reflection:nth-child(4) {
        width: 70px;
        height: 2px;
        top: 37%;
        right: 28%;
        clip-path: polygon(0 50%, 40% 0, 60% 0, 100% 50%, 60% 100%, 40% 100%);
      }
      .reflection:nth-child(5) {
        width: 70px;
        height: 3px;
        top: 46%;
        right: 8%;
        clip-path: polygon(0 50%, 40% 0, 60% 0, 100% 50%, 60% 100%, 40% 100%);
      }

      /* HILLS */
      .hill-1 {
        right: -25%;
        bottom: 20%;
        width: 150px;
        height: 40px;
        border-radius: 50%;
        background: #e6b29d;
      }
      .shadow-hill-1 {
        right: -25%;
        top: -30%;
        width: 150px;
        height: 40px;
        border-radius: 50%;
        background: #f1c7a0;
      }

      .hill-2 {
        right: -36%;
        bottom: 10%;
        width: 150px;
        height: 80px;
        border-radius: 50%;
        background: #c29182;
      }
      .shadow-hill-2 {
        right: -36%;
        top: -65%;
        width: 150px;
        height: 80px;
        border-radius: 50%;
        background: #e5bb96;
      }

      .hill-3 {
        left: -100%;
        bottom: -28%;
        width: 350px;
        height: 150px;
        border-radius: 50%;
        background: #b77873;
        z-index: 3;
      }
      .hill-4 {
        right: -100%;
        bottom: -40%;
        width: 350px;
        height: 150px;
        border-radius: 50%;
        background: #a16773;
        z-index: 3;
      }

      /* TREES */
      .tree-1,
      .tree-2,
      .tree-3 {
        z-index: 3;
      }
      .tree-1 {
        bottom: 20%;
        left: 3%;
        width: 50px;
      }
      .tree-2 {
        bottom: 14%;
        left: 25%;
        width: 50px;
      }
      .tree-3 {
        bottom: 10%;
        right: 1%;
        width: 65px;
      }

      /* FILTER */
      .filter {
        width: 100%;
        height: 100%;
        background: linear-gradient(0deg, #fff 0%, transparent 40%);
        opacity: 0.2;
        z-index: 5;
      }

      /* CONTENT */
      .content-section {
        width: 100%;
        height: 30%;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .weather-info {
        display: flex;
        justify-content: space-around;
        position: absolute;
        width: 100%;
        top: 0;
        padding-top: 15px;
        color: #fff;
        z-index: 10;
      }

      .left-side {
        font-size: 11pt;
        font-weight: 600;
      }

      .icon svg {
        width: 40px;
      }

      .right-side {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
      }

      .temperature {
        font-size: 20pt;
        font-weight: 700;
      }

      .forecast {
        display: flex;
        flex-direction: column;
        justify-content: space-evenly;
        height: 100%;
        width: 100%;
        padding: 10px 25px;
      }

      .forecast div {
        display: flex;
        justify-content: space-between;
        font-size: 9pt;
        color: lightslategray;
      }

      .separator {
        height: 2px;
        background: #e9e9e9;
        border-radius: 1px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <section class="landscape-section">
        <div class="sky"></div>
        <div class="sun" id="sun"></div>

        <div class="hill-1"></div>
        <div class="hill-2"></div>

        <div class="ocean">
          <div class="reflection"></div>
          <div class="reflection"></div>
          <div class="reflection"></div>
          <div class="reflection"></div>
          <div class="reflection"></div>
          <div class="shadow-hill-1"></div>
          <div class="shadow-hill-2"></div>
        </div>

        <div class="hill-3"></div>
        <div class="hill-4"></div>

        <div class="filter"></div>
      </section>

      <section class="content-section">
        <div class="weather-info">
          <div class="left-side">
            <span id="weatherText">Loading...</span>
          </div>
          <div class="right-side">
            <span id="city">-</span>
            <span id="date">-</span>
            <span class="temperature" id="temp">-°C</span>
          </div>
        </div>

        <div class="forecast" id="forecast"></div>
      </section>
    </div>

    <script>
      async function getLocation() {
        const res = await fetch('https://ipapi.co/json/');
        return res.json();
      }

      async function getWeather(lat, lon) {
        const res = await fetch(
          `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&daily=temperature_2m_max,weathercode&timezone=auto`,
        );
        return res.json();
      }

      function formatDate(d) {
        return new Date(d).toLocaleDateString('id-ID', {
          weekday: 'short',
          day: 'numeric',
          month: 'short',
        });
      }

      (async () => {
        try {
          const loc = await getLocation();
          document.getElementById('city').innerText = loc.city;

          const data = await getWeather(loc.latitude, loc.longitude);

          if (!data.current_weather) {
            console.error('API ERROR:', data);
            return;
          }

          const current = data.current_weather;

          document.getElementById('temp').innerText =
            current.temperature + '°C';

          //STATIC
          // document.getElementById('weatherText').innerText = 'Cuaca';

          //DYNAMICS
          function getWeatherText(code) {
            if (code === 0) return 'Cerah';
            if (code <= 3) return 'Berawan';
            if (code <= 48) return 'Mendung';
            if (code <= 67) return 'Hujan';
            if (code <= 99) return 'Badai';
            return 'Tidak diketahui';
          }

          document.getElementById('weatherText').innerText = getWeatherText(
            current.weathercode,
          );

          document.getElementById('date').innerText = formatDate(new Date());

          const forecast = document.getElementById('forecast');
          forecast.innerHTML = '';

          data.daily.time.slice(1, 4).forEach((d, i) => {
            const el = document.createElement('div');
            el.innerHTML = `<span>${formatDate(d)}</span><span>${data.daily.temperature_2m_max[i + 1]}°C</span>`;
            forecast.appendChild(el);

            if (i < 2) {
              const sep = document.createElement('div');
              sep.className = 'separator';
              forecast.appendChild(sep);
            }
          });
        } catch (err) {
          console.error('ERROR:', err);
        }
      })();
    </script>
  </body>
</html>
